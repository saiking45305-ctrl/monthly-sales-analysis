<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Monthly Sales Analysis{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><header><a class="brand" href="{{ url_for('dashboard') }}">Monthly Sales Analysis</a>{% if session.get('user_id') %}<nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('sales') }}">Sales data</a><a href="{{ url_for('download') }}">Export CSV</a><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Log out</button></form><button id="theme">Theme</button></nav>{% endif %}</header><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
